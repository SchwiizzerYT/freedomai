<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0A24">
<title>FreedomAI — Freedom Light 1.0</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕊️</text></svg>">
<style>
:root{--bg:#0B0A24;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--tx:#EEF0FF;--mut:#9A9CC4;--a:#7C5CFF;--b:#22D3EE;--c:#FF5CA8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
.orb{position:fixed;border-radius:50%;filter:blur(90px);opacity:.45;pointer-events:none;animation:float 16s ease-in-out infinite}
.o1{width:380px;height:380px;background:var(--a);top:-120px;left:-100px}
.o2{width:320px;height:320px;background:var(--b);bottom:-120px;right:-80px;animation-delay:-6s}
.o3{width:240px;height:240px;background:var(--c);top:45%;left:55%;opacity:.25;animation-delay:-11s}
@keyframes float{50%{transform:translate(40px,-50px) scale(1.15)}}
.grad{background:linear-gradient(90deg,var(--a),var(--b),var(--c),var(--a));background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:300% 0}}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--a),var(--b));display:grid;place-items:center;font-style:normal;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(124,92,255,.18)}}
.badge{font-size:.72rem;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--card)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.btn{background:linear-gradient(135deg,var(--a),#5B7BFF);padding:13px 20px;border-radius:14px;font-weight:700;width:100%;transition:transform .15s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(124,92,255,.45)}
.btn:active{transform:scale(.98)}

/* auth */
#auth{position:relative;height:100%;display:grid;place-items:center;padding:20px;overflow:auto}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px;backdrop-filter:blur(18px);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.box h1{font-size:1.9rem;line-height:1.15;margin:22px 0 6px;letter-spacing:-.03em}
.box p.sub{color:var(--mut);font-size:.95rem;margin-bottom:20px}
.tabs{display:flex;background:rgba(0,0,0,.25);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{flex:1;padding:9px;border-radius:9px;color:var(--mut);font-weight:600;transition:.25s}
.tabs button.on{background:var(--card);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line)}
label{display:block;font-size:.85rem;color:var(--mut);margin:12px 0 6px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx);font:inherit;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 4px rgba(124,92,255,.2)}
.err{color:#FF8FA3;font-size:.88rem;min-height:1.3em;margin:10px 0}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* app */
#app{position:relative;height:100%;display:flex;flex-direction:column;max-width:860px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
header .sp{flex:1}
.who{color:var(--mut);font-size:.85rem;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:.85rem;transition:.2s}
.ib:hover{border-color:var(--a)}
#msgs{flex:1;overflow:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}
.m{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.55;font-size:.97rem;word-wrap:break-word;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}}
.m.u{align-self:flex-end;background:linear-gradient(135deg,var(--a),#5B7BFF);border-bottom-right-radius:6px}
.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.m pre{background:rgba(0,0,0,.4);padding:12px;border-radius:10px;overflow-x:auto;margin:8px 0;font-size:.86rem}
.m code{font-family:ui-monospace,Menlo,Consolas,monospace;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:5px}
.m pre code{background:none;padding:0}
.dots{display:flex;gap:5px;padding:6px 2px}
.dots span{width:8px;height:8px;border-radius:50%;background:var(--b);animation:bounce 1s infinite}
.dots span:nth-child(2){animation-delay:.15s;background:var(--a)}
.dots span:nth-child(3){animation-delay:.3s;background:var(--c)}
@keyframes bounce{50%{transform:translateY(-7px);opacity:.5}}
#empty{margin:auto;text-align:center;padding:20px}
#empty h2{font-size:clamp(1.8rem,6vw,2.6rem);letter-spacing:-.03em;line-height:1.1}
#empty p{color:var(--mut);margin:10px 0 22px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:.9rem;transition:.2s}
.chip:hover{border-color:var(--b);transform:translateY(-3px)}
.chip:nth-child(odd){animation:bob 4s ease-in-out infinite}
.chip:nth-child(even){animation:bob 5s ease-in-out infinite reverse}
@keyframes bob{50%{transform:translateY(-5px)}}
form#f{display:flex;gap:10px;padding:12px 16px 16px}
form#f input{flex:1;border-radius:16px;padding:15px 16px}
#send{width:52px;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));font-size:1.2rem;transition:transform .2s}
#send:hover{transform:rotate(-12deg) scale(1.08)}
#send:disabled{opacity:.5;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<section id="auth">
  <div class="box">
    <div class="logo"><i>🕊️</i><span>Freedom<span class="grad">AI</span></span><span class="badge">Light 1.0</span></div>
    <h1>Savolingni ber. <span class="grad">Javob shu yerda.</span></h1>
    <p class="sub">Kirish uchun hisob oching yoki mavjud hisobingizga kiring.</p>
    <div class="tabs"><button id="tl" class="on" type="button">Kirish</button><button id="tr" type="button">Ro‘yxatdan o‘tish</button></div>
    <form id="af" novalidate>
      <div id="nw" hidden><label for="nm">Ismingiz</label><input id="nm" autocomplete="name" placeholder="Masalan, Javohir"></div>
      <label for="em">Email</label><input id="em" type="email" autocomplete="email" placeholder="siz@email.com">
      <label for="pw">Parol</label><input id="pw" type="password" autocomplete="current-password" placeholder="Kamida 6 ta belgi">
      <div class="err" id="er" role="alert"></div>
      <button class="btn" id="ab" type="submit">Kirish</button>
    </form>
  </div>
</section>

<section id="app" hidden>
  <header>
    <div class="logo"><i>🕊️</i><span>Freedom<span class="grad">AI</span></span></div>
    <span class="badge">Light 1.0</span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="ib" id="nc" type="button">Yangi suhbat</button>
    <button class="ib" id="lo" type="button">Chiqish</button>
  </header>
  <div id="msgs">
    <div id="empty">
      <h2>Salom! Nima <span class="grad">yaratamiz?</span></h2>
      <p>Savol bering yoki quyidagilardan birini tanlang.</p>
      <div class="chips" id="chips"></div>
    </div>
  </div>
  <form id="f" autocomplete="off">
    <input id="q" placeholder="Xabaringizni yozing…" maxlength="2000" aria-label="Xabar">
    <button id="send" type="submit" aria-label="Yuborish">➤</button>
  </form>
</section>

<script>
// Kalit shu yerga yoziladi. Bo‘sh qoldirsangiz, sayt Vercel’dagi /api/chat orqali ishlaydi.
const GEMINI_API_KEY="AQ.Ab8RN6LKGRXGDjIWGHX1xvOLrqi5nfAuK18TMvct3dJxhKhm3Q";
const MODEL="gemini-3.8-flash";
const SYSTEM="Sen FreedomAI (Freedom Light 1.0) — foydalanuvchiga yordam beradigan sun’iy intellekt yordamchisan. Foydalanuvchi qaysi tilda yozsa, o‘sha tilda javob ber (odatda o‘zbekcha). Javoblar aniq, qisqa va foydali bo‘lsin, ortiqcha kirish gaplarsiz to‘g‘ridan-to‘g‘ri javobdan boshla. Kod so‘ralsa, ``` bilan blok qilib yoz.";
async function askGemini(history,onChunk){
  const direct=GEMINI_API_KEY.length>10;
  const contents=history.slice(-12).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content.slice(0,4000)}]}));
  const headers={"Content-Type":"application/json"};
  let url="/api/chat",body={contents};
  if(direct){
    url="https://generativelanguage.googleapis.com/v1beta/models/"+MODEL+":streamGenerateContent?alt=sse";
    headers["x-goog-api-key"]=GEMINI_API_KEY;
    body={systemInstruction:{parts:[{text:SYSTEM}]},contents,generationConfig:{maxOutputTokens:1024}};
  }
  const r=await fetch(url,{method:"POST",headers,body:JSON.stringify(body)});
  if(!r.ok){
    let m="AI xatosi";
    try{const d=await r.json();const e=Array.isArray(d)?d[0]:d;m=(e.error&&e.error.message)||e.error||m}catch(x){}
    throw new Error(m);
  }
  const rd=r.body.getReader(),dec=new TextDecoder();let buf="",full="";
  while(true){
    const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});
    const lines=buf.split("\n");buf=lines.pop();
    for(const ln of lines){
      if(!ln.startsWith("data:"))continue;
      try{
        const j=JSON.parse(ln.slice(5));
        const c=j.candidates&&j.candidates[0];
        const t=c&&c.content&&c.content.parts?c.content.parts.map(p=>p.text||"").join(""):"";
        if(t){full+=t;onChunk&&onChunk(full)}
      }catch(x){}
    }
  }
  if(!full)throw new Error("AI javob bermadi (filtr yoki bo‘sh javob)");
  return full;
}
const $=s=>document.querySelector(s);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let mode="login",user=null,chat=[],busy=false;
const SUG=["Telegram bot g‘oyasi ber","Python’da oddiy o‘yin yoz","O‘quv markazi uchun reklama matni","Flutter nima? Oddiy tushuntir"];

async function hash(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("freedomai:"+t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function setMode(m){mode=m;$("#tl").classList.toggle("on",m==="login");$("#tr").classList.toggle("on",m==="reg");$("#nw").hidden=m==="login";$("#ab").textContent=m==="login"?"Kirish":"Hisob ochish";$("#er").textContent="";$("#pw").autocomplete=m==="login"?"current-password":"new-password"}
$("#tl").onclick=()=>setMode("login");$("#tr").onclick=()=>setMode("reg");
function fail(t){$("#er").textContent=t;const b=document.querySelector(".box");b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake")}

$("#af").onsubmit=async e=>{
  e.preventDefault();
  const em=$("#em").value.trim().toLowerCase(),pw=$("#pw").value,nm=$("#nm").value.trim();
  if(!/^\S+@\S+\.\S+$/.test(em))return fail("Email noto‘g‘ri yozilgan.");
  if(pw.length<6)return fail("Parol kamida 6 ta belgidan iborat bo‘lsin.");
  const users=ls.get("fa_users",{}),h=await hash(pw);
  if(mode==="reg"){
    if(!nm)return fail("Ismingizni kiriting.");
    if(users[em])return fail("Bu email bilan hisob bor. Kirish bo‘limiga o‘ting.");
    users[em]={name:nm,h};ls.set("fa_users",users);
  }else{
    if(!users[em]||users[em].h!==h)return fail("Email yoki parol noto‘g‘ri.");
  }
  ls.set("fa_session",em);enter(em);
};

function enter(em){
  const u=ls.get("fa_users",{})[em];if(!u){ls.set("fa_session",null);return}
  user=em;chat=ls.get("fa_chat_"+em,[]);
  $("#who").textContent=u.name;$("#auth").hidden=true;$("#app").hidden=false;
  render();$("#q").focus();
}
$("#lo").onclick=()=>{ls.set("fa_session",null);user=null;$("#app").hidden=true;$("#auth").hidden=false;$("#pw").value=""};
$("#nc").onclick=()=>{if(busy)return;chat=[];ls.set("fa_chat_"+user,chat);render()};

function md(t){
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return esc(t).replace(/```(?:\w+)?\n?([\s\S]*?)```/g,"<pre><code>$1</code></pre>")
    .replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
    .replace(/\n/g,"<br>").replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g,(m)=>m.replace(/<br>/g,"\n"));
}
function bubble(role,text){
  const d=document.createElement("div");d.className="m "+(role==="user"?"u":"a");
  if(role==="user")d.textContent=text;else d.innerHTML=md(text);
  $("#msgs").appendChild(d);scroll();return d;
}
function scroll(){const m=$("#msgs");m.scrollTop=m.scrollHeight}
function render(){
  document.querySelectorAll(".m").forEach(n=>n.remove());
  $("#empty").hidden=chat.length>0;
  chat.forEach(m=>bubble(m.role,m.content));
}
$("#chips").innerHTML=SUG.map(s=>`<button class="chip" type="button">${s}</button>`).join("");
$("#chips").onclick=e=>{if(e.target.classList.contains("chip")){$("#q").value=e.target.textContent;$("#f").requestSubmit()}};

$("#f").onsubmit=async e=>{
  e.preventDefault();
  const text=$("#q").value.trim();if(!text||busy)return;
  busy=true;$("#send").disabled=true;$("#q").value="";$("#empty").hidden=true;
  chat.push({role:"user",content:text});bubble("user",text);
  const w=document.createElement("div");w.className="m a";w.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  $("#msgs").appendChild(w);scroll();
  let reply;
  try{
    reply=await askGemini(chat,t=>{w.innerHTML=md(t);scroll()});
    chat.push({role:"assistant",content:reply});
  }catch(err){
    w.innerHTML="";w.textContent="Xatolik: "+err.message+". Qayta yuboring.";
    chat.pop();
  }
  ls.set("fa_chat_"+user,chat.slice(-60));
  busy=false;$("#send").disabled=false;$("#q").focus();
};

const s=ls.get("fa_session",null);if(s)enter(s);
</script>
</body>
</html>
